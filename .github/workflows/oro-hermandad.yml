name: Comprobar addon Oro de Hermandad

on:
  push:
    paths:
      - 'addon/OroHermandad/**'
      - 'test-lua/**'
      - 'test-vectors/**'
      - 'scripts/build-oro-hermandad.mjs'
      - '.pkgmeta'
      - '.github/workflows/oro-hermandad.yml'
  pull_request:
    paths:
      - 'addon/OroHermandad/**'
      - 'test-lua/**'
      - 'test-vectors/**'
      - 'scripts/build-oro-hermandad.mjs'
      - '.pkgmeta'
      - '.github/workflows/oro-hermandad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Instalar Lua 5.1 (la versión de WoW)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.1
      - name: Pruebas del addon
        run: sh test-lua/run.sh
      - name: Preparar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      # El zip no se guarda en Git: se construye aquí y queda en la ejecución (artefacto OroHermandad.zip)
      # para que los colaboradores lo descarguen desde la pestaña Actions.
      - name: Construir el zip del addon
        run: node scripts/build-oro-hermandad.mjs "$RUNNER_TEMP/OroHermandad.zip"
      - name: Guardar el zip en la ejecución
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ runner.temp }}/OroHermandad.zip
          archive: false
          if-no-files-found: error
      # Lo mismo que hará la publicación en CurseForge, sin subir nada: si el empaquetador mete algo que no es el addon
      # (una carpeta nueva en la raíz que falta en el ignore de .pkgmeta), se ve aquí y no el día de publicar.
      - name: Notas de prueba para el empaquetador
        # Sin .notas-version.md el empaquetador escribe un CHANGELOG.md suyo dentro del zip.
        run: printf -- '- Comprobación del empaquetado.\n' > .notas-version.md
      # Sin clave de GitHub ni de CurseForge: -d no sube nada.
      - name: Empaquetar como en CurseForge, sin subir
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -u -n "{package-name}-{project-version}:{project-version}"
          pandoc: false
      - name: Comprobar que el zip de CurseForge es el mismo
        run: |
          set -eu
          shopt -s nullglob
          zips=(.release/OroHermandad-*.zip)
          [ "${#zips[@]}" -eq 1 ] || { echo "Esperaba un zip en .release y hay ${#zips[@]}" >&2; exit 1; }
          unzip -q "$RUNNER_TEMP/OroHermandad.zip" -d "$RUNNER_TEMP/esperado"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/curseforge"
          diff -r "$RUNNER_TEMP/esperado" "$RUNNER_TEMP/curseforge"
